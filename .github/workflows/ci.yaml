name: Hello World CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run hello script
        run: |
          chmod +x hello.sh
          ./hello.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run test
        run: echo "Test job completed successfully"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy message
        run: echo "Deploy job completed successfully"